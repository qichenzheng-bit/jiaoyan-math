name: UI Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/ui-preview.yml', 'tests/ui_preview.py']
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: |
          (cd frontend && npm run preview -- --port 4173) &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/ui_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-ui-screenshots
          path: ui-screenshots/
