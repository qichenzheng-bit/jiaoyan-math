name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jiaoyan_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: jiaoyan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiaoyan_ci -d jiaoyan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jiaoyan_ci:ci-only-password@127.0.0.1:5432/jiaoyan_ci
      RUN_POSTGRES_INTEGRATION: "1"
      APP_ORIGIN: https://testserver
      COOKIE_SECURE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
