name: CI and release
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Keep active deployments intact; only the latest queued run is retained.
concurrency:
  group: jiaoyan-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      baseline: ${{ steps.scope.outputs.baseline }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Publish pending release checks
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for name in deployment-syntax backend frontend browser deploy; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=pending -f context="jiaoyan/$name" \
              -f description="Queued or running" -f target_url="$RUN_URL" >/dev/null
          done
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select validated test scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          mode, baseline = "full", ""
          try:
              sha = os.environ["GITHUB_SHA"]
              before = os.environ.get("BEFORE", "")
              if (os.environ["GITHUB_EVENT_NAME"] == "push"
                  and os.environ["GITHUB_REF"] == "refs/heads/main"
                  and re.fullmatch(r"[a-f0-9]{40}", before)
                  and before != "0" * 40
                  and git("rev-list", "--parents", "-n", "1", sha).decode().split() == [sha, before]):
                  paths = git("diff", "--name-only", "--no-renames", "-z", before, sha).split(b"\0")
                  changed = [p.decode("utf-8") for p in paths if p]
                  css_only = bool(changed) and all(
                      re.fullmatch(r"frontend/src/[^\n]+\.css", p) for p in changed
                  )
                  if css_only:
                      raw = subprocess.check_output(
                          ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{before}/status"],
                          timeout=20
                      )
                      states = {s["context"]: s["state"] for s in json.loads(raw)["statuses"]}
                      required = ("deployment-syntax", "backend", "frontend", "browser", "deploy")
                      if all(states.get("jiaoyan/" + name) == "success" for name in required):
                          mode, baseline = "css-fast", before
          except Exception as exc:
              print("Cannot establish safe baseline; using full validation:", exc)
          print("Validation mode:", mode, "baseline:", baseline or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mode={mode}\n")
              out.write(f"baseline={baseline}\n")
              out.write(f"backend_required={'false' if mode == 'css-fast' else 'true'}\n")
          PY
  deployment-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: for f in deploy/*.sh; do bash -n "$f"; done
      - run: bash deploy/unpack-video-source.sh "$RUNNER_TEMP/video-source-check"
      - name: Package exact source revision for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/release-source.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-source-${{ github.sha }}
          path: ${{ runner.temp }}/release-source.tar.gz
          if-no-files-found: error
          retention-days: 3
  backend:
    needs: plan
    if: needs.plan.outputs.backend_required != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jiaoyan_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: jiaoyan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiaoyan_ci -d jiaoyan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jiaoyan_ci:ci-only-password@127.0.0.1:5432/jiaoyan_ci
      RUN_POSTGRES_INTEGRATION: "1"
      APP_ORIGIN: https://testserver
      COOKIE_SECURE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3
  browser:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
      - name: Verify compiled revision
        run: |
          test -s frontend/dist/index.html
          test "$(cat frontend/dist/release-sha.txt)" = "$GITHUB_SHA"
      - name: Install browser test driver
        run: python -m pip install -r tests/requirements-browser.txt
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/fonts/jiaoyan-cjk
          key: jiaoyan-cjk-ubuntu2404-v1
      - name: Check preinstalled Chrome and Chinese fonts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          google-chrome --version
          # Hosted Ubuntu already has Chrome and its runtime libraries.
          # Only install a Chinese font if no suitable font is present.
          fontdir="$HOME/.local/share/fonts/jiaoyan-cjk"
          if [[ -d "$fontdir" ]]; then fc-cache -f "$fontdir"; fi
          if [[ -z "$(fc-list :lang=zh-cn family)" ]]; then
            tmp=$(mktemp -d)
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            (cd "$tmp" && apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 download fonts-noto-cjk)
            dpkg-deb -x "$tmp"/fonts-noto-cjk_*.deb "$tmp/extracted"
            mkdir -p "$fontdir"
            cp -a "$tmp/extracted/usr/share/fonts/." "$fontdir/"
            fc-cache -f "$fontdir"
          fi
          test -n "$(fc-list :lang=zh-cn family)"
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              page = browser.new_page()
              page.set_content("<p>微光数学</p>")
              assert page.locator("p").inner_text() == "微光数学"
              browser.close()
          PY
      - run: |
          python tests/serve_frontend.py &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          python tests/ui_preview.py
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: clean-workspace-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
          retention-days: 3
  deploy:
    needs: [plan, backend, frontend, deployment-syntax, browser]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true' &&
      needs.plan.result == 'success' &&
      (needs.backend.result == 'success' ||
        (needs.backend.result == 'skipped' && needs.plan.outputs.backend_required == 'false' && needs.plan.outputs.mode == 'css-fast')) &&
      needs.frontend.result == 'success' &&
      needs.deployment-syntax.result == 'success' &&
      needs.browser.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
    concurrency:
      group: jiaoyan-production
      cancel-in-progress: false
    steps:
      # Avoid the production runner's unreliable GitHub git/TLS connection.
      # Download only the exact archive from this trusted, gated workflow run.
      - uses: actions/download-artifact@v7
        with:
          name: release-source-${{ github.sha }}
          path: ${{ runner.temp }}/release-download-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/release-download-${{ github.run_id }}-${{ github.run_attempt }}/frontend-dist
      - name: Deploy validated source and frontend
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/jiaoyan-release.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          tar -xzf "$RUNNER_TEMP/release-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/release-source.tar.gz" -C "$work"
          dist="$RUNNER_TEMP/release-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/frontend-dist"
          test -s "$dist/index.html"
          test "$(cat "$dist/release-sha.txt")" = "$GITHUB_SHA"
          mkdir -p "$work/frontend/dist"
          cp -a "$dist/." "$work/frontend/dist/"
          cd "$work"
          JIAOYAN_PREBUILT_FRONTEND=1 bash deploy/release.sh

  report:
    # A separate hosted job publishes readable commit statuses for main deployments.
    needs: [plan, deployment-syntax, backend, frontend, browser, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report test and deployment results
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNTAX_RESULT: ${{ needs.deployment-syntax.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          report() {
            local name="$1" result="$2" state
            case "$result" in
              success) state=success ;;
              failure) state=failure ;;
              cancelled|skipped|*) state=error ;;
            esac
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="jiaoyan/$name" \
              -f description="$name: $result" -f target_url="$RUN_URL" >/dev/null
          }
          report deployment-syntax "$SYNTAX_RESULT"
          if [[ "$PLAN_RESULT" == success && "$PLAN_MODE" == css-fast && "$BACKEND_RESULT" == skipped && "$BASELINE" =~ ^[a-f0-9]{40}$ ]]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state=success -f context=jiaoyan/backend \
              -f description="backend: validated baseline ${BASELINE:0:7} (CSS only)" -f target_url="$RUN_URL" >/dev/null
          else
            report backend "$BACKEND_RESULT"
          fi
          report frontend "$FRONTEND_RESULT"
          report browser "$BROWSER_RESULT"
          report deploy "$DEPLOY_RESULT"
